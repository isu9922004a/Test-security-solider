<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>金幣推推樂</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#08111f;
  --panel:#111c2e;
  --gold:#ffd44d;
  --gold2:#ffb300;
  --text:#f6f8fc;
  --muted:#9fb0c8;
}

html,body{
  margin:0;
  min-height:100%;
  background:linear-gradient(#08111f,#0e1a2d);
  color:var(--text);
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  "Noto Sans TC",
  sans-serif;
  overflow-x:hidden;
}

body{
  display:flex;
  justify-content:center;
}

#app{
  width:min(100vw,520px);
  padding:
  calc(10px + env(safe-area-inset-top))
  10px
  calc(14px + env(safe-area-inset-bottom));
}

h1{
  margin:2px 0 8px;
  text-align:center;
  font-size:24px;
}

.hud{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-bottom:8px;
}

.card{
  background:#111c2e;
  border:1px solid #263954;
  border-radius:13px;
  padding:7px 3px;
  text-align:center;
}

.card b{
  display:block;
  font-size:17px;
}

.card span{
  font-size:11px;
  color:var(--muted);
}

#gameBox{
  position:relative;
  border:2px solid #29405f;
  border-radius:18px;
  overflow:hidden;
  background:#06101c;
  box-shadow:0 12px 35px rgba(0,0,0,.28);
}

canvas{
  display:block;
  width:100%;
  height:auto;
  background:#0b1626;
  touch-action:none;
}

#banner{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.9);

  padding:12px 18px;

  border-radius:999px;

  background:rgba(7,15,26,.88);

  border:1px solid #4c6687;

  font-weight:900;
  font-size:20px;

  opacity:0;

  pointer-events:none;

  transition:.18s;
}

#banner.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

button{
  font:inherit;
}

.main{
  border:0;
  border-radius:15px;
  padding:13px 8px;
  font-size:17px;
  font-weight:900;
}

.drop{
  background:linear-gradient(#ffe675,#ffbe24);
  color:#332600;
  box-shadow:0 4px 0 #a87500;
}

.auto{
  background:linear-gradient(#2f5076,#1d3552);
  color:white;
  border:1px solid #406387;
  box-shadow:0 4px 0 #08111f;
}

.main:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 rgba(0,0,0,.5);
}

.aim{
  margin-top:9px;
  padding:9px 10px;

  background:#111c2e;

  border:1px solid #263954;

  border-radius:14px;
}

.aimTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;

  font-size:12px;

  color:#b7c5d8;

  margin-bottom:6px;
}

.track{
  height:12px;

  border-radius:999px;

  background:#08111f;

  position:relative;

  overflow:visible;

  border:1px solid #263954;
}

.knob{
  position:absolute;

  top:50%;

  width:20px;
  height:20px;

  border-radius:50%;

  background:#ffd44d;

  transform:translate(-50%,-50%);

  box-shadow:
  0 0 0 3px rgba(255,212,77,.18);
}

.tip{
  font-size:12px;
  line-height:1.5;

  color:#8fa3bd;

  text-align:center;

  margin-top:7px;
}
</style>
</head>

<body>

<div id="app">

<h1>🪙 金幣推推樂</h1>

<div class="hud">

<div class="card">
<b id="credits">30</b>
<span>可投金幣</span>
</div>

<div class="card">
<b id="won">0</b>
<span>掉落得分</span>
</div>

<div class="card">
<b id="combo">x1</b>
<span>連續掉落</span>
</div>

<div class="card">
<b id="best">0</b>
<span>最高分</span>
</div>

</div>


<div id="gameBox">

<canvas
id="game"
width="432"
height="620">
</canvas>

<div id="banner">
+1 金幣！
</div>

</div>


<div class="aim">

<div class="aimTitle">

<span>
投幣位置
</span>

<span>
拖曳或點遊戲上方
</span>

</div>

<div id="track" class="track">

<div
id="knob"
class="knob">
</div>

</div>

</div>


<div class="controls">

<button
id="dropBtn"
class="main drop">
🪙 投幣
</button>

<button
id="autoBtn"
class="main auto">
▶ 自動投幣：關
</button>

</div>


<div class="tip">

純娛樂遊戲，不涉及真實金錢。

<br>

選好位置 → 投幣 → 等推板把金幣推下前緣。

<br>

⭐ 星星金幣掉落可獲得額外分數。

</div>

</div>


<script>
(()=>{

"use strict";

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


const creditsEl =
document.getElementById("credits");

const wonEl =
document.getElementById("won");

const comboEl =
document.getElementById("combo");

const bestEl =
document.getElementById("best");


const dropBtn =
document.getElementById("dropBtn");

const autoBtn =
document.getElementById("autoBtn");

const track =
document.getElementById("track");

const knob =
document.getElementById("knob");

const banner =
document.getElementById("banner");


const W =
canvas.width;

const H =
canvas.height;


const LEFT = 28;

const RIGHT =
W - 28;

const TOP = 62;

const EDGE = 565;

const COIN_R = 13;


let credits = 30;

let won = 0;

let combo = 1;


let best =
Number(
localStorage.getItem(
"coinPusherBest"
) || 0
);


let aimX =
W / 2;


let coins = [];


let auto = false;

let lastAuto = 0;

let lastTime =
performance.now();


let bannerTimer = null;


let pusher = {

y:225,

minY:205,

maxY:305,

dir:1,

speed:64,

vy:0,

h:48

};


/* ===========================
   HUD
=========================== */

function updateHUD(){

creditsEl.textContent =
credits;


wonEl.textContent =
won;


comboEl.textContent =
"x" + combo;


bestEl.textContent =
best;


const pct =

(aimX - LEFT) /

(RIGHT - LEFT);


knob.style.left =

(pct * 100) +

"%";

}


/* ===========================
   RANDOM
=========================== */

function rand(a,b){

return

a +

Math.random() *

(b-a);

}


/* ===========================
   CREATE COIN
=========================== */

function addCoin(

x,

y,

special=false,

vx=0,

vy=0

){

coins.push({

x:x,

y:y,

r:COIN_R,

vx:vx,

vy:vy,

rot:
Math.random() *
Math.PI *
2,

spin:
(Math.random()-.5) *
2,

special:special,

dead:false

});


if(
coins.length >
180
){

coins.splice(
0,
coins.length-180
);

}

}


/* ===========================
   STARTING COINS
=========================== */

function seedCoins(){

coins = [];


for(
let row=0;
row<6;
row++
){

for(
let col=0;
col<8;
col++
){

const x =

78 +

col*39 +

(row%2 ? 19 : 0);


const y =

320 +

row*36 +

(
Math.random()*4-2
);


if(
x <
RIGHT-10
){

addCoin(

x,

y,

Math.random() <
0.055

);

}

}

}

}


/* ===========================
   RESET
=========================== */

function reset(){

credits = 30;

won = 0;

combo = 1;

aimX = W/2;


pusher.y = 225;

pusher.dir = 1;


seedCoins();

updateHUD();

}


/* ===========================
   BANNER
=========================== */

function showBanner(text){

banner.textContent =
text;


banner.classList.add(
"show"
);


clearTimeout(
bannerTimer
);


bannerTimer =
setTimeout(
()=>{

banner.classList.remove(
"show"
);

},
520
);

}


/* ===========================
   DROP COIN
=========================== */

function dropCoin(){

if(
credits <= 0
){

showBanner(
"沒有金幣了"
);

return;

}


credits--;


addCoin(

aimX,

TOP + 4,

Math.random() <
0.06,

Math.random()*10-5,

34

);


updateHUD();

}


/* ===========================
   SCORE
=========================== */

function award(coin){

const oldCombo =
combo;


const points =
coin.special
?
5
:
1;


const add =
points *
oldCombo;


won +=
add;


if(
coin.special
){

credits += 2;

}


combo =
Math.min(
9,
combo + 1
);


if(
won >
best
){

best =
won;


localStorage.setItem(

"coinPusherBest",

String(best)

);

}


if(
coin.special
){

showBanner(

"⭐ +" +
add +
" 分！"

);

}else{

showBanner(

"🪙 +" +
add +
" 分！"

);

}


updateHUD();

}


/* ===========================
   PHYSICS
=========================== */

function step(dt){


const previousY =
pusher.y;


pusher.y +=

pusher.dir *

pusher.speed *

dt;


if(
pusher.y >=
pusher.maxY
){

pusher.y =
pusher.maxY;

pusher.dir = -1;

}


if(
pusher.y <=
pusher.minY
){

pusher.y =
pusher.minY;

pusher.dir = 1;

}


pusher.vy =

(pusher.y -
previousY) /

Math.max(
dt,
0.0001
);



/* COIN MOVEMENT */

for(
const c
of coins
){

/* 微微往出口方向移動 */

c.vy +=

7.5 *

dt;


/* 摩擦 */

c.vx *=

Math.pow(
0.965,
dt*60
);


c.vy *=

Math.pow(
0.965,
dt*60
);


c.x +=
c.vx * dt;


c.y +=
c.vy * dt;


c.rot +=
c.spin * dt;



/* 左牆 */

if(
c.x -
c.r <
LEFT
){

c.x =
LEFT +
c.r;


c.vx =
Math.abs(
c.vx
) * 0.5;

}


/* 右牆 */

if(
c.x +
c.r >
RIGHT
){

c.x =
RIGHT -
c.r;


c.vx =
-Math.abs(
c.vx
) * 0.5;

}


/* 後牆 */

if(
c.y -
c.r <
TOP
){

c.y =
TOP +
c.r;


c.vy =
Math.abs(
c.vy
) * 0.4;

}


/* ===========================
   PUSHER COLLISION
=========================== */

const px1 =
LEFT + 9;

const px2 =
RIGHT - 9;

const py1 =
pusher.y;

const py2 =
pusher.y +
pusher.h;


if(

c.x+c.r > px1 &&

c.x-c.r < px2 &&

c.y+c.r > py1 &&

c.y-c.r < py2

){

if(
c.y <
py1 +
pusher.h*0.55
){

c.y =
py1 -
c.r;


c.vy =
Math.min(

c.vy,

pusher.vy *
0.75

);

}

else{

c.y =
py2 +
c.r;


c.vy =
Math.max(

c.vy,

pusher.vy *
0.9 +
22

);

}

}

}


/* ===========================
   COIN VS COIN
=========================== */

for(
let iteration=0;
iteration<2;
iteration++
){

for(
let i=0;
i<coins.length;
i++
){

const a =
coins[i];


if(
a.dead
){

continue;

}


for(
let j=i+1;
j<coins.length;
j++
){

const b =
coins[j];


if(
b.dead
){

continue;

}


let dx =
b.x-a.x;


let dy =
b.y-a.y;


const radius =
a.r+b.r;


const distanceSquared =
dx*dx +
dy*dy;


if(

distanceSquared <= 0 ||

distanceSquared >=
radius*radius

){

continue;

}


const distance =
Math.sqrt(
distanceSquared
);


const nx =
dx /
distance;


const ny =
dy /
distance;


const overlap =
radius -
distance;


/* 分離金幣 */

a.x -=

nx *
overlap *
0.5;


a.y -=

ny *
overlap *
0.5;


b.x +=

nx *
overlap *
0.5;


b.y +=

ny *
overlap *
0.5;



/* 碰撞速度 */

const rvx =
b.vx -
a.vx;


const rvy =
b.vy -
a.vy;


const separatingVelocity =

rvx*nx +

rvy*ny;


if(
separatingVelocity <
0
){

const impulse =

-separatingVelocity *

0.42;


a.vx -=
impulse*nx;

a.vy -=
impulse*ny;


b.vx +=
impulse*nx;

b.vy +=
impulse*ny;

}

}

}

}


/* ===========================
   FALLING COINS
=========================== */

for(
const c
of coins
){

if(
c.y -
c.r >
EDGE
){

c.dead =
true;


award(c);

}

}


coins =
coins.filter(

c =>

!c.dead &&

c.y <
H+70

);

}


/* ===========================
   DRAW COIN
=========================== */

function drawCoin(c){

ctx.save();


ctx.translate(
c.x,
c.y
);


ctx.rotate(
c.rot
);


const gradient =

ctx.createRadialGradient(

-4,
-5,
2,

0,
0,
c.r

);


if(
c.special
){

gradient.addColorStop(
0,
"#fff9ae"
);

gradient.addColorStop(
0.45,
"#ffe25d"
);

gradient.addColorStop(
1,
"#ed9800"
);

}else{

gradient.addColorStop(
0,
"#fff0a0"
);

gradient.addColorStop(
0.45,
"#ffd24a"
);

gradient.addColorStop(
1,
"#b87800"
);

}


ctx.fillStyle =
gradient;


ctx.beginPath();


ctx.arc(

0,
0,
c.r,

0,

Math.PI*2

);


ctx.fill();


ctx.strokeStyle =
"rgba(100,60,0,.75)";


ctx.lineWidth = 2;

ctx.stroke();


ctx.strokeStyle =
"rgba(255,255,255,.55)";


ctx.lineWidth = 1;


ctx.beginPath();


ctx.arc(

0,

0,

c.r-4,

0,

Math.PI*2

);


ctx.stroke();


ctx.fillStyle =
"#986300";


ctx.font =
"bold 12px -apple-system";


ctx.textAlign =
"center";


ctx.textBaseline =
"middle";


ctx.fillText(

c.special
?
"★"
:
"1",

0,

0.5

);


ctx.restore();

}


/* ===========================
   DRAW GAME
=========================== */

function draw(){

ctx.clearRect(
0,
0,
W,
H
);


/* 背景 */

const background =

ctx.createLinearGradient(

0,
0,

0,
H

);


background.addColorStop(
0,
"#152845"
);


background.addColorStop(
1,
"#08121f"
);


ctx.fillStyle =
background;


ctx.fillRect(
0,
0,
W,
H
);


/* 機台左右邊框 */

ctx.fillStyle =
"#263f5f";


ctx.fillRect(

LEFT-8,

TOP-18,

8,

EDGE-TOP+36

);


ctx.fillRect(

RIGHT,

TOP-18,

8,

EDGE-TOP+36

);


/* 遊戲桌面 */

ctx.fillStyle =
"#0d2036";


ctx.fillRect(

LEFT,

TOP,

RIGHT-LEFT,

EDGE-TOP

);


/* 桌面線 */

ctx.strokeStyle =
"rgba(255,255,255,.05)";


for(
let y=TOP;
y<EDGE;
y+=32
){

ctx.beginPath();


ctx.moveTo(
LEFT,
y
);


ctx.lineTo(
RIGHT,
y
);


ctx.stroke();

}


/* ===========================
   PUSHER
=========================== */

ctx.fillStyle =
"rgba(72,112,153,.90)";


ctx.fillRect(

LEFT+9,

pusher.y,

RIGHT-LEFT-18,

pusher.h

);


ctx.fillStyle =
"rgba(255,255,255,.13)";


ctx.fillRect(

LEFT+9,

pusher.y,

RIGHT-LEFT-18,

5

);


ctx.fillStyle =
"#1f3149";


ctx.fillRect(

LEFT+9,

pusher.y+
pusher.h-7,

RIGHT-LEFT-18,

7

);


/* ===========================
   FRONT EDGE
=========================== */

ctx.fillStyle =
"#5c748f";


ctx.fillRect(

LEFT,

EDGE,

RIGHT-LEFT,

9

);


ctx.fillStyle =
"#080e17";


ctx.fillRect(

LEFT,

EDGE+9,

RIGHT-LEFT,

H-EDGE-9

);


ctx.fillStyle =
"#b7c5d8";


ctx.font =
"bold 12px -apple-system";


ctx.textAlign =
"center";


ctx.fillText(

"▼ 金幣掉落區 ▼",

W/2,

EDGE+31

);


/* ===========================
   AIM LINE
=========================== */

ctx.save();


ctx.strokeStyle =
"rgba(255,212,77,.80)";


ctx.setLineDash(
[6,5]
);


ctx.beginPath();


ctx.moveTo(
aimX,
20
);


ctx.lineTo(
aimX,
TOP-4
);


ctx.stroke();


ctx.restore();


ctx.fillStyle =
"#ffd44d";


ctx.beginPath();


ctx.moveTo(
aimX-7,
TOP-10
);


ctx.lineTo(
aimX+7,
TOP-10
);


ctx.lineTo(
aimX,
TOP
);


ctx.closePath();

ctx.fill();


/* DRAW ALL COINS */

for(
const coin
of coins
){

drawCoin(
coin
);

}

}


/* ===========================
   LOOP
=========================== */

function loop(time){

let dt =

Math.min(

0.028,

(time-lastTime) /
1000

);


lastTime =
time;


/* AUTO DROP */

if(
auto &&
time-lastAuto >
480
){

lastAuto =
time;


if(
credits >
0
){

dropCoin();

}else{

auto = false;


autoBtn.textContent =
"▶ 自動投幣：關";

}

}


step(dt);

draw();


requestAnimationFrame(
loop
);

}


/* ===========================
   AIM
=========================== */

function setAim(
clientX,
element
){

const rect =

element.getBoundingClientRect();


let x =

(clientX -
rect.left) /

rect.width *

W;


aimX =

Math.max(

LEFT +
COIN_R,

Math.min(

RIGHT -
COIN_R,

x

)

);


updateHUD();

}


/* CLICK GAME */

canvas.addEventListener(

"pointerdown",

e => {

setAim(
e.clientX,
canvas
);

}

);


canvas.addEventListener(

"pointermove",

e => {

if(

e.buttons ||

e.pointerType ===
"touch"

){

setAim(
e.clientX,
canvas
);

}

}

);


/* ===========================
   SLIDER
=========================== */

function sliderAim(e){

const rect =

track.getBoundingClientRect();


const percent =

Math.max(

0,

Math.min(

1,

(e.clientX -
rect.left) /

rect.width

)

);


aimX =

LEFT +

percent *

(RIGHT-LEFT);


aimX =

Math.max(

LEFT +
COIN_R,

Math.min(

RIGHT -
COIN_R,

aimX

)

);


updateHUD();

}


track.addEventListener(

"pointerdown",

e => {

e.preventDefault();

sliderAim(e);

}

);


track.addEventListener(

"pointermove",

e => {

if(

e.buttons ||

e.pointerType ===
"touch"

){

sliderAim(e);

}

}

);


/* ===========================
   DROP BUTTON
=========================== */

dropBtn.addEventListener(

"click",

dropCoin

);


/* ===========================
   AUTO BUTTON
=========================== */

autoBtn.addEventListener(

"click",

()=>{

auto =
!auto;


if(
auto
){

autoBtn.textContent =
"⏸ 自動投幣：開";

}else{

autoBtn.textContent =
"▶ 自動投幣：關";

}

}

);


/* ===========================
   START
=========================== */

reset();


lastTime =
performance.now();


requestAnimationFrame(
loop
);


})();
</script>

</body>
</html>
